name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run merge parity tests
        run: make parity

      - name: Check whitespace
        run: git diff --check
