name: release

# Publish cross-built release artifacts when a v* tag is pushed.
# Each target is packaged as sb-fox-<os>-<arch>-<version>.tar.gz, plus a
# single SHA256SUMS file covering all archives.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release

env:
  BINARY: sb-fox

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run merge parity tests
        run: make parity

      - name: Check whitespace
        run: git diff --check

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build frontend (embedded)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          out="${BINARY}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${out}" ./cmd/sb-fox

      - name: Package archive
        id: package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          name="${BINARY}-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}"
          mkdir -p "dist/${name}"
          cp "${BINARY}${{ matrix.ext }}" "dist/${name}/"
          cp -R data "dist/${name}/"
          [ -f README.md ] && cp README.md "dist/${name}/" || true
          [ -f LICENSE ] && cp LICENSE "dist/${name}/" || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "archive=dist/${name}.tar.gz" >>"$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
