name: release

# Publish cross-built release assets when a v* tag is pushed.
# Release assets are uploaded directly from the runner to avoid consuming
# GitHub Actions artifact storage quota.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release

env:
  BINARY: sb-fox

jobs:
  release:
    name: test, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run merge parity tests
        run: make parity

      - name: Check whitespace
        run: git diff --check

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          rm -rf dist
          mkdir -p dist
          while read -r goos goarch ext; do
            name="${BINARY}-${goos}-${goarch}-${VERSION}"
            bin="${BINARY}${ext}"
            mkdir -p "dist/${name}"
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${name}/${bin}" ./cmd/sb-fox
            cp -R data "dist/${name}/"
            [ -f README.md ] && cp README.md "dist/${name}/" || true
            [ -f LICENSE ] && cp LICENSE "dist/${name}/" || true
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -rf "dist/${name}"
          done <<'TARGETS'
          linux amd64
          linux arm64
          darwin amd64
          darwin arm64
          windows amd64 .exe
          TARGETS

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz | tee SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
