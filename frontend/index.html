<!doctype html>
<html lang="zh-CN" data-theme="light-neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        color-scheme: light;
        background: #f5f5f7;
        color: #27272a;
      }
      html,
      body,
      #app {
        min-height: 100%;
        background: #f5f5f7;
        color: #27272a;
      }
      html[data-theme='dark-neutral'],
      html[data-theme='dark-neutral'] body,
      html[data-theme='dark-neutral'] #app {
        background: #1a1a1a;
        color: #e5e5e5;
      }
    </style>
    <script>
      ;(() => {
        const key = 'sb-fox-theme'
        const defaultTheme = 'light-neutral'
        const themes = new Set([defaultTheme, 'dark-neutral'])
        const colors = {
          'light-neutral': { bg: '#f5f5f7', fg: '#27272a', scheme: 'light' },
          'dark-neutral': { bg: '#1a1a1a', fg: '#e5e5e5', scheme: 'dark' },
        }
        let theme = defaultTheme
        try {
          const stored = localStorage.getItem(key)
          if (themes.has(stored)) {
            theme = stored
          } else {
            if (stored) console.warn(`sb-fox: unsupported theme "${stored}", reset to ${defaultTheme}`)
            localStorage.setItem(key, defaultTheme)
          }
        } catch (err) {
          console.warn('sb-fox: unable to read theme preference', err)
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = colors[theme].scheme
        document.documentElement.style.backgroundColor = colors[theme].bg
        document.documentElement.style.color = colors[theme].fg
      })()
    </script>
    <title>sb-fox</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
